<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <title>个人财务管理</title>
    <link rel="stylesheet" href="styles.css">
    <!-- ECharts for Statistics Page -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <!-- Toast Notification -->
    <div id="toast">操作成功</div>

    <!-- Edit Bill Modal -->
    <div class="modal" id="edit-bill-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">编辑账单</div>
                <button class="close-modal" onclick="closeModal('edit-bill-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">类型</label>
                    <select class="form-select" id="edit-bill-type">
                        <option value="expense">支出</option>
                        <option value="income">收入</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">金额</label>
                    <input class="form-input" type="number" step="0.01" id="edit-bill-amount" placeholder="请输入金额">
                </div>
                <div class="form-group">
                    <label class="form-label">分类</label>
                    <select class="form-select" id="edit-bill-category">
                        <!-- Filled by JavaScript -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">备注</label>
                    <input class="form-input" type="text" id="edit-bill-note" placeholder="备注（选填）">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('edit-bill-modal')">取消</button>
                <button class="btn btn-primary" onclick="saveEditedBill()">保存</button>
            </div>
        </div>
    </div>

    <!-- Add Goal Modal -->
    <div class="modal" id="add-goal-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">添加存钱目标</div>
                <button class="close-modal" onclick="closeModal('add-goal-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">目标名称</label>
                    <input class="form-input" type="text" id="goal-name" placeholder="请输入目标名称">
                </div>
                <div class="form-group">
                    <label class="form-label">目标金额</label>
                    <input class="form-input" type="number" step="0.01" id="goal-target" placeholder="请输入目标金额">
                </div>
                <div class="form-group">
                    <label class="form-label">当前金额</label>
                    <input class="form-input" type="number" step="0.01" id="goal-current" placeholder="请输入当前金额">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('add-goal-modal')">取消</button>
                <button class="btn btn-primary" onclick="addGoal()">添加</button>
            </div>
        </div>
    </div>

    <!-- Add Budget Modal -->
    <div class="modal" id="add-budget-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">添加预算</div>
                <button class="close-modal" onclick="closeModal('add-budget-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">分类</label>
                    <select class="form-select" id="budget-category">
                        <!-- Filled by JavaScript -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">预算金额</label>
                    <input class="form-input" type="number" step="0.01" id="budget-amount" placeholder="请输入预算金额">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('add-budget-modal')">取消</button>
                <button class="btn btn-primary" onclick="addBudget()">添加</button>
            </div>
        </div>
    </div>

    <!-- Fixed Expense Modal -->
    <div class="modal" id="fixed-expense-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">添加固定支出</div>
                <button class="close-modal" onclick="closeModal('fixed-expense-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">支出名称</label>
                    <input class="form-input" type="text" id="fixed-expense-name" placeholder="如：房租、水电费等">
                </div>
                <div class="form-group">
                    <label class="form-label">金额</label>
                    <input class="form-input" type="number" step="0.01" id="fixed-expense-amount" placeholder="请输入金额">
                </div>
                <div class="form-group">
                    <label class="form-label">周期</label>
                    <select class="form-select" id="fixed-expense-cycle">
                        <option value="weekly">每周</option>
                        <option value="monthly" selected>每月</option>
                        <option value="yearly">每年</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">开始日期</label>
                    <input class="form-input" type="date" id="fixed-expense-start-date">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('fixed-expense-modal')">取消</button>
                <button class="btn btn-primary" onclick="addFixedExpense()">添加</button>
            </div>
        </div>
    </div>

    <!-- Backup/Restore Modal -->
    <div class="modal" id="backup-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">数据备份与恢复</div>
                <button class="close-modal" onclick="closeModal('backup-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">备份数据</label>
                    <textarea class="form-input" id="backup-data" rows="6" readonly></textarea>
                    <button class="btn btn-primary" onclick="copyBackupData()" style="margin-top: 10px;">复制数据</button>
                </div>
                <div class="form-group">
                    <label class="form-label">恢复数据</label>
                    <textarea class="form-input" id="restore-data" rows="6" placeholder="粘贴备份数据"></textarea>
                    <button class="btn btn-primary" onclick="restoreData()" style="margin-top: 10px;">恢复数据</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('backup-modal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- Page: Home -->
    <div class="page active" id="page-home">
        <header style="margin-bottom: 20px;">
            <h1 style="font-size: 24px;">记一笔</h1>
            <p class="text-secondary" id="current-date">2026年3月27日</p>
        </header>
        <!-- Add Bill Module -->
        <div class="add-bill-container">
            <!-- Type Switch -->
            <div class="type-switch">
                <div class="type-option active expense" data-type="expense" onclick="setBillType('expense')">支出</div>
                <div class="type-option" data-type="income" onclick="setBillType('income')">收入</div>
            </div>
            <!-- Amount Input -->
            <div class="amount-input-group">
                <span class="currency-symbol">¥</span>
                <input class="amount-input has-symbol" id="amount" inputmode="decimal" placeholder="0.00" type="number"/>
                <div class="error-msg" id="amount-error">请输入有效的金额（大于0，最多两位小数）</div>
            </div>
            <!-- Category Grid -->
            <div class="category-grid" id="category-grid">
                <!-- Categories injected by JS -->
            </div>
            <!-- Note Input -->
            <input class="note-input" id="note" placeholder="写点备注...（选填）" type="text"/>
            <!-- Submit Button -->
            <button class="btn-submit" onclick="submitBill()">确认记账 (可继续)</button>
        </div>
        <!-- Recent Summary Widget -->
        <div class="card" style="margin-top: 20px;">
            <h3>今日概览</h3>
            <div class="stat-summary">
                <div class="stat-box">
                    <div class="stat-label">支出</div>
                    <div class="stat-value expense" id="today-expense">¥0.00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">收入</div>
                    <div class="stat-value income" id="today-income">¥0.00</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Page: Bills -->
    <div class="page" id="page-bills">
        <h1>账单明细</h1>
        <div class="filter-controls">
            <button class="filter-btn active" data-filter="all" onclick="setBillFilter('all')">全部</button>
            <button class="filter-btn" data-filter="expense" onclick="setBillFilter('expense')">支出</button>
            <button class="filter-btn" data-filter="income" onclick="setBillFilter('income')">收入</button>
        </div>
        
        <!-- 时间筛选器 -->
        <div class="time-filter-controls">
            <select id="time-filter" onchange="setTimeFilter(this.value)">
                <option value="today">今天</option>
                <option value="week">本周</option>
                <option value="month" selected>本月</option>
                <option value="year">今年</option>
                <option value="custom">自定义</option>
            </select>
            
            <!-- 自定义时间范围 -->
            <div id="custom-time-range" style="display: none; margin-top: 10px;">
                <input type="date" id="start-date">
                <input type="date" id="end-date">
                <button class="btn btn-primary" onclick="applyCustomRange()">应用</button>
            </div>
        </div>
        
        <!-- 概览统计 -->
        <div class="card" style="margin-top: 20px;">
            <h3>统计概览</h3>
            <div class="stat-summary">
                <div class="stat-box">
                    <div class="stat-label">总收入</div>
                    <div class="stat-value income" id="period-income">¥0.00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">总支出</div>
                    <div class="stat-value expense" id="period-expense">¥0.00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">净收入</div>
                    <div class="stat-value" id="period-net">¥0.00</div>
                </div>
            </div>
        </div>
        
        <!-- 搜索功能 -->
        <div class="search-container">
            <input type="text" id="bill-search" placeholder="搜索备注、分类、金额..." oninput="searchBills()">
        </div>
        
        <div class="card">
            <div id="bills-list">
                <!-- Bills injected by JS -->
            </div>
        </div>
    </div>

    <!-- Page: Stats -->
    <div class="page" id="page-stats">
        <h1>收支统计</h1>
        <div class="card">
            <div class="stat-summary">
                <div class="stat-box">
                    <div class="stat-label">本月支出</div>
                    <div class="stat-value expense" id="month-expense">¥0.00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">本月收入</div>
                    <div class="stat-value income" id="month-income">¥0.00</div>
                </div>
            </div>
            <div class="chart-container" id="chart-main"></div>
            <div class="chart-container" id="chart-category"></div>
        </div>
        
        <!-- AI智能分析区域 -->
        <div class="card" id="ai-analysis-section" style="margin-top: 20px; display: none;">
            <h3>AI智能分析</h3>
            <div id="ai-insights">
                <!-- AI分析结果将在这里显示 -->
            </div>
        </div>
    </div>

    <!-- Page: Budget & Fixed Expenses -->
    <div class="page" id="page-budget">
        <h1>预算管理</h1>
        <div class="card budget-section">
            <button class="btn btn-primary" onclick="openAddBudgetModal()" style="width: 100%; margin-bottom: 15px;">+ 添加预算</button>
            <div id="budgets-list">
                <!-- Budgets injected by JS -->
            </div>
        </div>
        
        <h1>固定支出</h1>
        <div class="card fixed-expenses-section">
            <button class="btn btn-primary" onclick="openAddFixedExpenseModal()" style="width: 100%; margin-bottom: 15px;">+ 添加固定支出</button>
            <div id="fixed-expenses-list">
                <!-- Fixed expenses injected by JS -->
            </div>
        </div>
        
        <h1>储蓄目标</h1>
        <div class="card">
            <button class="btn btn-primary" onclick="openAddGoalModal()" style="width: 100%; margin-bottom: 15px;">+ 添加目标</button>
            <div id="goals-list">
                <!-- Goals injected by JS -->
            </div>
        </div>
    </div>

    <!-- Page: Settings -->
    <div class="page" id="page-settings">
        <h1>设置</h1>
        <div class="card">
            <div class="setting-item">
                <span>深色模式</span>
                <div class="setting-switch" id="theme-toggle" onclick="toggleTheme()"></div>
            </div>
            <div class="setting-item" onclick="openBackupModal()">
                <span>数据备份与恢复</span>
                <span>&gt;</span>
            </div>
            <div class="setting-item" onclick="clearData()">
                <span style="color: var(--danger-color);">清空所有数据</span>
                <span>&gt;</span>
            </div>
            <div class="setting-item">
                <span>启用AI分析</span>
                <div class="setting-switch" id="ai-toggle" onclick="toggleAIAnalysis()"></div>
            </div>
        </div>
        <div class="text-secondary text-center" style="margin-top: 20px; font-size: 12px;">
            Version 2.0.0
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="tab-bar">
        <div class="tab-item active" onclick="switchPage('home')">
            <div class="tab-icon">🏠</div>
            <div>首页</div>
        </div>
        <div class="tab-item" onclick="switchPage('bills')">
            <div class="tab-icon">🧾</div>
            <div>账单</div>
        </div>
        <div class="tab-item" onclick="switchPage('stats')">
            <div class="tab-icon">📊</div>
            <div>统计</div>
        </div>
        <div class="tab-item" onclick="switchPage('budget')">
            <div class="tab-icon">💰</div>
            <div>预算</div>
        </div>
        <div class="tab-item" onclick="switchPage('settings')">
            <div class="tab-icon">⚙️</div>
            <div>设置</div>
        </div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
